# Koyeb deploy fayli
# https://app.koyeb.com - web orqali Dockerfile + Environment vars bilan deploy qiling

service:
  name: telegram-bot
  instance_type: nano
  ports:
    - port: 8080
      protocol: http
  routes:
    - path: /
      port: 8080
  health_checks:
    - name: health
      path: /
      port: 8080
  scale:
    min: 1
    max: 1
